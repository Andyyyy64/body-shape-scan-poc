[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "body-shape-scan-poc"
version = "0.2.0"
description = "Local research tools for fixed-camera body-shape change measurement"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
vision = ["numpy>=2,<3", "opencv-python>=4.13,<5"]
segmentation = ["ultralytics>=8.4,<9"]

[project.scripts]
body-scan = "body_scan.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["body_scan"]

[dependency-groups]
dev = ["ruff>=0.11,<1"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
